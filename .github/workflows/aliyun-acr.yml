# ISO Hub - 构建并推送到阿里云 ACR（个人版）
# 镜像仓库: registry.cn-hangzhou.aliyuncs.com/dcchen/isohub
#
# 触发规则:
#   - push 到 master 分支      -> 只推 latest
#   - 打 v* tag (如 v1.0.6)    -> 推 1.0.6 和 latest 两个 tag
#   - 手动 workflow_dispatch   -> 推 latest（可指定版本）
#
# 说明: 阿里云 ACR 个人版的构建规则不支持命名捕获组 (?<name>...)，
#       无法从 git tag 自动提取版本号，因此改用 GitHub Actions 构建推送。
#
# 需要在仓库 Settings > Secrets and variables > Actions 配置:
#   ALIYUN_REGISTRY_USERNAME  阿里云账号名（或 RAM 用户名）
#   ALIYUN_REGISTRY_PASSWORD  ACR 镜像仓库登录密码（控制台 > 访问凭证 里设置，非阿里云登录密码）
#
# 未配置上述两个 secret 时，本 workflow 会在「Check ACR credentials」步骤明确报错并中止，
# 而不是在登录步骤抛出难懂的 "Username and password required"。

name: Build & Push Aliyun ACR

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本 tag（留空则只推 latest）'
        required: false
        default: ''

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 提前校验凭据, 缺失时给出可操作的中文提示
      - name: Check ACR credentials
        env:
          ACR_USER: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ACR_PASS: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          if [ -z "$ACR_USER" ] || [ -z "$ACR_PASS" ]; then
            echo "::error title=缺少阿里云 ACR 凭据::请到仓库 Settings → Secrets and variables → Actions 添加 ALIYUN_REGISTRY_USERNAME 与 ALIYUN_REGISTRY_PASSWORD。密码在 ACR 控制台「访问凭证」中单独设置, 不是阿里云账号登录密码。"
            echo "missing: USER=$([ -z "$ACR_USER" ] && echo yes || echo no) PASS=$([ -z "$ACR_PASS" ] && echo yes || echo no)"
            exit 1
          fi
          echo "ACR 凭据已配置, 继续构建"

      # 解析要推送的镜像 tag 列表（逗号分隔）
      - name: Resolve image tags
        id: ver
        run: |
          IMAGE="registry.cn-hangzhou.aliyuncs.com/dcchen/isohub"
          TAGS="${IMAGE}:latest"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # v1.0.6 -> 1.0.6 （去掉 v 前缀）
            VER="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS},${IMAGE}:${VER}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
            TAGS="${TAGS},${IMAGE}:${VER}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      # 注意: 必须关闭 provenance/sbom!
      # BuildKit v0.32+ 默认附加 OCI attestation(provenance/sbom), 其空配置描述符
      # 用 application/vnd.oci.empty.v1+json 媒体类型, 阿里云个人版 ACR 不支持,
      # 否则推送报: denied: unknown manifest class for application/vnd.oci.empty.v1+json
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.ver.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
