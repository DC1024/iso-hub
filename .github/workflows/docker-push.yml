# ISO Hub - 构建并推送到 Docker Hub
# 触发: 推送到 main 分支 / 手动运行(Workflow dispatch)
name: Build & Push Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: dcchendockeruser/iso-hub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync README to Docker Hub overview
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, urllib.error
          import base64, os
          # docker login 已把凭据写入 ~/.docker/config.json，auth 是 base64(username:PAT)
          cfg = json.load(open(os.path.expanduser("~/.docker/config.json")))
          auth = None
          for k, v in cfg.get("auths", {}).items():
              if v.get("auth"):
                  auth = v["auth"]; break
          if not auth:
              raise SystemExit("no docker auth found")
          # 解码出用户名用于 URL，密码(PAT)用于 Basic auth
          user, pw = base64.b64decode(auth).decode().split(":", 1)
          repo = "dcchendockeruser/iso-hub"
          desc = open("README.md", encoding="utf-8").read()
          basic = base64.b64encode(f"{user}:{pw}".encode()).decode()
          req = urllib.request.Request(
              f"https://hub.docker.com/v2/repositories/{repo}/",
              data=json.dumps({"full_description": desc}).encode(),
              method="PATCH",
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Basic {basic}",
              },
          )
          try:
              with urllib.request.urlopen(req) as r:
                  print("OVERVIEW STATUS", r.status)
          except urllib.error.HTTPError as e:
              print("OVERVIEW HTTP_ERROR", e.code)
              print(e.read().decode()[:800])
              raise SystemExit(1)
          except Exception as e:
              print("OVERVIEW EXC", repr(e))
              raise SystemExit(1)
          PYEOF