# ISO Hub - 构建并推送到 Docker Hub
# 触发: 推送到 master 分支 / 打 v* tag / 手动运行(Workflow dispatch)
#   - push 到 master      -> 只推 latest
#   - 打 v* tag (如 v1.0.8) -> 推 1.0.8 和 latest 两个 tag
#   - 手动 workflow_dispatch -> 推 latest（可指定版本）
name: Build & Push Docker Hub

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本 tag（留空则只推 latest）'
        required: false
        default: ''
  push:
    branches: [master]
    tags: ['v*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 解析要推送的镜像 tag 列表（逗号分隔）
      - name: Resolve image tags
        id: ver
        run: |
          IMAGE="dcchendockeruser/iso-hub"
          TAGS="${IMAGE}:latest"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # v1.0.8 -> 1.0.8 （去掉 v 前缀）
            VER="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS},${IMAGE}:${VER}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
            TAGS="${TAGS},${IMAGE}:${VER}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.ver.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync README to Docker Hub overview
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_PAT: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error
          user = os.environ["HUB_USER"]
          pat  = os.environ["HUB_PAT"]
          repo = "dcchendockeruser/iso-hub"
          # 1) 用 PAT 登录换取 JWT 会话令牌
          login = urllib.request.Request(
              "https://hub.docker.com/v2/users/login/",
              data=json.dumps({"username": user, "password": pat}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(login) as r:
              jwt = json.loads(r.read().decode())["token"]
          # 2) 用 JWT 更新 full_description
          desc = open("README.md", encoding="utf-8").read()
          req = urllib.request.Request(
              f"https://hub.docker.com/v2/repositories/{repo}/",
              data=json.dumps({"full_description": desc}).encode(),
              method="PATCH",
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"JWT {jwt}",
              },
          )
          try:
              with urllib.request.urlopen(req) as r:
                  print("OVERVIEW STATUS", r.status)
          except urllib.error.HTTPError as e:
              print("OVERVIEW HTTP_ERROR", e.code)
              print(e.read().decode()[:800])
              raise SystemExit(1)
          except Exception as e:
              print("OVERVIEW EXC", repr(e))
              raise SystemExit(1)
          PYEOF