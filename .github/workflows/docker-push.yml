# ISO Hub - 构建并推送到 Docker Hub
# 触发: 推送到 master / beta 分支 / 打 v* tag / 手动运行(Workflow dispatch)
#   - push 到 master         -> 只推 latest
#   - push 到 beta           -> 只推 beta(**不碰 latest**, 测试中镜像不会被默认拉取)
#   - 打 v* tag (如 v1.0.8)  -> 推 1.0.8 和 latest 两个 tag
#   - 手动 workflow_dispatch -> 推 latest（可指定版本）
name: Build & Push Docker Hub

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本 tag（留空则只推 latest）'
        required: false
        default: ''
  push:
    # beta = 开发分支, 推上去只发布 :beta 标签(绝不碰 :latest),
    # 这样"不指定版本号的 docker pull"永远只拿到正式版。
    branches: [master, beta]
    tags: ['v*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 解析要推送的镜像 tag 列表（逗号分隔）
      - name: Resolve image tags
        id: ver
        run: |
          IMAGE="dcchendockeruser/iso-hub"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # v1.0.8 -> 1.0.8 （去掉 v 前缀）; 正式发版同时推进 latest
            VER="${GITHUB_REF_NAME#v}"
            TAGS="${IMAGE}:${VER},${IMAGE}:latest"
          elif [ "${GITHUB_REF_NAME}" = "beta" ]; then
            # 开发分支: 只推 :beta, 绝不动 :latest
            # —— 用户 `docker pull` 不指定 tag 时默认拿 :latest, 不会被测试中镜像污染
            TAGS="${IMAGE}:beta"
          else
            # master 的 push
            TAGS="${IMAGE}:latest"
          fi
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
            TAGS="${TAGS},${IMAGE}:${VER}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.ver.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync README to Docker Hub overview
        # beta 的每次迭代都会触发本 workflow, 没必要反复去改 Docker Hub 的仓库描述
        if: github.ref_name != 'beta'
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_PAT: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error
          user = os.environ["HUB_USER"]
          pat  = os.environ["HUB_PAT"]
          repo = "dcchendockeruser/iso-hub"
          # 1) 用 PAT 登录换取 JWT 会话令牌
          login = urllib.request.Request(
              "https://hub.docker.com/v2/users/login/",
              data=json.dumps({"username": user, "password": pat}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(login) as r:
              jwt = json.loads(r.read().decode())["token"]
          # 2) 用 JWT 更新 full_description
          desc = open("README.md", encoding="utf-8").read()
          # Docker Hub 限制是 25000 字节（含中文时字节数 > 字符数），超限返回 400
          MAX = 24000
          raw = desc.encode("utf-8")
          if len(raw) > MAX:
              raw = raw[:MAX]
              # 回溯到 UTF-8 字符边界，避免截断在半个中文字符处
              while raw and (raw[-1] & 0xC0) == 0x80:
                  raw = raw[:-1]
              desc = raw.decode("utf-8", "ignore") + "\n\n> 完整文档见 GitHub：https://github.com/" + repo + "\n"
          req = urllib.request.Request(
              f"https://hub.docker.com/v2/repositories/{repo}/",
              data=json.dumps({"full_description": desc}).encode(),
              method="PATCH",
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"JWT {jwt}",
              },
          )
          try:
              with urllib.request.urlopen(req) as r:
                  print("OVERVIEW STATUS", r.status)
          except urllib.error.HTTPError as e:
              print("OVERVIEW HTTP_ERROR", e.code)
              print(e.read().decode()[:800])
              raise SystemExit(1)
          except Exception as e:
              print("OVERVIEW EXC", repr(e))
              raise SystemExit(1)
          PYEOF