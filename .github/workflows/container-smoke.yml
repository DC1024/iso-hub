# ISO Hub - 容器运行时冒烟
#
# 为什么需要这个 job:
#   test_nonroot_150.py 只对 Dockerfile / compose 的**文本**做断言(assertIn),
#   它保证"加固声明还在", 不保证"镜像真的能起来"。v1.5.0 踩过一次: `docker run`
#   不继承旧容器的 HostConfig, CapDrop 静默变成空数组 —— 容器起来了、服务也正常,
#   加固没了, 直到人工 inspect 才发现。CI 全绿同样可能交付一个启动即崩的镜像。
#
# 这个 workflow 用生产同款参数起容器, 断言三件事:
#   1. 服务真的能起来并返回 /api/health(同时带着非 root + 只读根 + 零能力)
#   2. 运行时身份与资源上限真的生效, 不只是写在 compose 里
#   3. /data 可写、/app 不可写 —— 只读根不是摆设
#
# 失败信息要能直接定位: 每条断言打印期望值与实际值, 失败时附容器日志。
# 注意: 这里直接轮询 HTTP, **不**等 Docker healthcheck —— 后者 interval=60s,
#       会把本来 3 秒的验证拖到一分多钟。

name: Container Smoke

on:
  pull_request:
  push:
    branches: [master, beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Run as uid 10001 (read-only rootfs, capped resources)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: isohub-smoke:ci
      CONTAINER: isohub-smoke
      DATA_DIR: /tmp/isohub-smoke-data
      HOST_PORT: 18080
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Prepare data dir owned by 10001
        # 绑定挂载的属主由宿主机决定, 容器内 chown 不了 —— 这正是 v1.5.0 升级
        # 最容易漏的一步, 必须在这里如实复现, 否则测的就不是真实升级路径。
        run: |
          rm -rf "$DATA_DIR"
          mkdir -p "$DATA_DIR"
          sudo chown -R 10001:10001 "$DATA_DIR"

      - name: Run container with production flags
        run: |
          docker run -d --name "$CONTAINER" \
            -p "$HOST_PORT:8080" \
            -v "$DATA_DIR:/data" \
            --user 10001:10001 \
            --read-only \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --tmpfs /home/isohub:rw,nosuid,size=8m,uid=10001,gid=10001,mode=700 \
            --memory 1g --cpus 2 --pids-limit 256 \
            -e ISO_HUB_REQUIRE_LOGIN=1 \
            -e ISO_HUB_SOURCE_STRATEGY=A \
            "$IMAGE"

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            if body=$(curl -fsS "http://127.0.0.1:${HOST_PORT}/api/health" 2>/dev/null); then
              printf '%s' "$body" > /tmp/health.json
              echo "/api/health 就绪, 耗时 ${i}s"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
              echo "容器已退出, 停止等待"
              docker logs "$CONTAINER" 2>&1 || true
              exit 1
            fi
            sleep 1
          done
          echo "60 秒内 /api/health 未就绪"
          docker logs "$CONTAINER" 2>&1 || true
          exit 1

      - name: Assert health payload
        # 全程用 python3: 本 job 不装 setup-python, ubuntu-latest 上只有 python3。
        run: |
          python3 - <<'PY'
          import json
          h = json.load(open("/tmp/health.json"))
          assert h.get("ok") is True, f"ok 字段不是 true: {h}"
          st = h.get("writable_states") or {}
          assert st.get("data") == "ok", f"/data 不可写(属主或挂载有问题): {st}"
          # 可选卷没挂 = missing; 若变成 denied, 说明容器把"没挂"误判成"写不了",
          # 两者处置方式完全不同(改 compose vs 改属主), 不能混。
          assert st.get("qb_config") == "missing", f"qb_config 预期 missing: {st}"
          print("health ok, writable_states:", json.dumps(st, ensure_ascii=False))
          PY

      - name: Assert runtime identity and writable data
        run: |
          uid=$(docker exec "$CONTAINER" id -u)
          if [ "$uid" != "10001" ]; then
            echo "运行时 uid=$uid, 期望 10001"
            exit 1
          fi
          echo "运行时 uid=10001 ok"

          docker exec "$CONTAINER" sh -c 'echo ok > /data/.smoke'
          docker exec "$CONTAINER" sh -c 'test "$(cat /data/.smoke)" = ok'
          echo "/data 可写 ok"

          # 只读根必须真的挡住写入: 能写 /app 就等于攻击者可以落 webshell
          if docker exec "$CONTAINER" sh -c 'echo x > /app/.smoke' 2>/dev/null; then
            echo "只读根失效: /app 可写"
            exit 1
          fi
          echo "/app 只读 ok"

      - name: Assert hardening and resource limits
        run: |
          python3 - <<'PY'
          import json, subprocess

          raw = subprocess.check_output(["docker", "inspect", "isohub-smoke"], text=True)
          c = json.loads(raw)[0]
          cfg, hc = c["Config"], c["HostConfig"]

          def check(name, actual, expected):
              if actual != expected:
                  raise SystemExit(f"{name}: 实际={actual!r} 期望={expected!r}")
              print(f"  ok {name} = {actual!r}")

          check("Config.User", cfg.get("User"), "10001:10001")
          check("ReadonlyRootfs", hc.get("ReadonlyRootfs"), True)
          check("CapDrop", hc.get("CapDrop"), ["ALL"])
          check("Memory", hc.get("Memory"), 1024 * 1024 * 1024)
          check("NanoCpus", hc.get("NanoCpus"), 2_000_000_000)
          check("PidsLimit", hc.get("PidsLimit"), 256)

          opts = hc.get("SecurityOpt") or []
          if not any("no-new-privileges" in o for o in opts):
              raise SystemExit(f"SecurityOpt 缺 no-new-privileges: {opts}")
          print("  ok SecurityOpt 含 no-new-privileges")

          tmpfs = hc.get("Tmpfs") or {}
          for mount in ("/tmp", "/home/isohub"):
              if mount not in tmpfs:
                  raise SystemExit(f"缺 tmpfs {mount}: {list(tmpfs)}")
          print("  ok tmpfs:", ", ".join(sorted(tmpfs)))
          PY

      # ---- 第 3 批(H2/M9)验收: socket-proxy 的放行范围必须"恰好等于"应用用到的范围 ----
      # 为什么必须放在这里跑, 而不是只写文本断言: haproxy.cfg 与 compose 都是部署面配置,
      # 写错了单元测试照样全绿(它们只能 grep 文本), 而线上的表现是"三个 sidecar 全部失联"
      # 或者"整个 Docker API 暴露给内网"。这里用**生产同款 compose 服务**起代理, 逐条打
      # 真实 HTTP, 顺便也证明 M9 的 read_only + cap_drop 没有把 haproxy 自己搞死。
      - name: Validate compose file
        run: docker compose config -q

      - name: Verify socket-proxy ACL
        run: |
          set -uo pipefail
          docker compose up -d --no-deps socket-proxy

          # 第一步: 先证明"haproxy 在 M9 的加固下真的在服务" —— 直接 exec 进去打 /_ping。
          # 这一步**不依赖** compose 的 healthcheck, 目的是把两个问题分开:
          #   这里失败 = M9 把代理搞死了(只读根/零能力导致起不来或不可用)
          #   这里通过、下一步失败 = compose 的 healthcheck 自身有问题
          # 分开才有可诊断性: 混在一起只会得到一句"未就绪"。
          served=""
          for _ in $(seq 1 60); do
            if docker exec iso-hub-socket-proxy wget -q -O /dev/null http://127.0.0.1:2375/_ping 2>/dev/null; then
              served=1; break
            fi
            sleep 1
          done
          if [ -z "$served" ]; then
            echo "haproxy 60s 内未响应 /_ping —— 检查 M9 的加固是否把代理搞死了"
            echo "--- 容器内是否有 wget(后续所有探针都依赖它) ---"
            docker exec iso-hub-socket-proxy sh -c 'command -v wget || echo "wget 不存在"' || true
            echo "--- 容器内身份与 docker.sock ---"
            docker exec iso-hub-socket-proxy sh -c \
              'id; ls -ld /run /var/run 2>&1; ls -l /run/docker.sock /var/run/docker.sock 2>&1' || true
            echo "--- 宿主侧看到的挂载 ---"
            docker inspect -f '{{range .Mounts}}{{.Type}} {{.Source}} -> {{.Destination}} rw={{.RW}}{{"\n"}}{{end}}' \
              iso-hub-socket-proxy || true
            echo "--- /etc/hosts ---"
            docker exec iso-hub-socket-proxy sh -c 'cat /etc/hosts' || true
            echo "--- 逐 flag 复现: 到底是哪一项加固让后端不可达 ---"
            for f in none --read-only --cap-drop=ALL --security-opt=no-new-privileges; do
              extra=""
              [ "$f" != "none" ] && extra="$f"
              cid=$(docker run -d --rm $extra \
                      -v /var/run/docker.sock:/var/run/docker.sock:ro \
                      -v "$PWD/docker/socket-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
                      haproxy:2.8-alpine 2>/dev/null) || { echo "  $f: 起不来"; continue; }
              sleep 3
              code=$( { docker exec "$cid" wget -S -O /dev/null http://127.0.0.1:2375/_ping 2>&1 \
                        | awk '/HTTP\//{print $2; exit}'; } || true )
              echo "  $f: ${code:-<无响应>}"
              docker rm -f "$cid" >/dev/null 2>&1 || true
            done
            echo "--- 容器状态 ---"
            docker inspect -f '{{json .State}}' iso-hub-socket-proxy || true
            docker logs iso-hub-socket-proxy 2>&1 | tail -40 || true
            exit 1
          fi
          echo "haproxy 已在服务 (127.0.0.1:2375/_ping)"

          # 第二步: compose 的 healthcheck 必须能转 healthy —— 主容器是
          # depends_on: service_healthy 的, 它不 healthy 就等于"全新部署起不来"。
          # 失败时把 Health.Log 打出来(每次尝试的 exit code + 原始输出), 否则只能看到
          # 一个 starting/unhealthy, 完全无法定位是 wget 不存在、DNS 解析、还是端口没通。
          st=""
          for _ in $(seq 1 90); do
            st=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                 iso-hub-socket-proxy 2>/dev/null || echo missing)
            [ "$st" = "healthy" ] && break
            [ "$st" = "missing" ] && break
            sleep 1
          done
          if [ "$st" != "healthy" ]; then
            echo "compose healthcheck 未转 healthy (status=$st), 逐次尝试明细:"
            docker inspect -f '{{range .State.Health.Log}}exit={{.ExitCode}} out={{.Output}}{{"\n"}}{{end}}' \
              iso-hub-socket-proxy || true
            echo "--- 容器内 wget 是否存在 ---"
            docker exec iso-hub-socket-proxy sh -c 'command -v wget || echo "wget 不存在"' || true
            echo "--- 容器内 localhost 解析 ---"
            docker exec iso-hub-socket-proxy sh -c 'cat /etc/hosts' || true
            docker logs iso-hub-socket-proxy 2>&1 | tail -20 || true
            exit 1
          fi
          echo "socket-proxy healthy"

          # 用容器自带的 busybox wget 探: 它在 healthcheck 里已被证明存在, 不必再拉镜像。
          # -S 把响应头打到 stderr, 取第一行 HTTP 状态码; wget 遇 4xx 会非零退出, 故 `|| true`。
          probe() {
            want="$1"; desc="$2"; shift 2
            out=$(docker exec iso-hub-socket-proxy wget -S -O /dev/null "$@" 2>&1 || true)
            got=$(printf '%s\n' "$out" | awk '/HTTP\//{print $2; exit}')
            if [ "$got" != "$want" ]; then
              echo "::error::$desc: 期望 $want, 实际 ${got:-<无响应>}"
              printf '%s\n' "$out"
              exit 1
            fi
            echo "  ok $desc -> $got"
          }
          # 必须用 127.0.0.1 而不是 localhost: 容器 /etc/hosts 里 ::1 排在前面,
          # musl 会先解析到 ::1, 而 haproxy 的 bind *:2375 只监听 IPv4。
          # (compose 的 healthcheck 踩过同一个坑, 见 docker-compose.yml 里的注释)
          B=http://127.0.0.1:2375

          # --- 必须放行, 否则功能倒退 ---
          probe 200 "GET /_ping (compose healthcheck)"                   "$B/_ping"
          probe 200 "GET /version (排障)"                               "$B/version"
          probe 404 "GET /containers/iso-hub-samba/json -> 到 daemon"   "$B/containers/iso-hub-samba/json"
          probe 404 "GET /v1.44/containers/iso-hub-webdav/json (版本前缀)" "$B/v1.44/containers/iso-hub-webdav/json"
          probe 404 "POST /containers/iso-hub-samba/start -> 到 daemon" --post-data=x "$B/containers/iso-hub-samba/start"
          probe 404 "POST /containers/iso-hub-samba/restart -> 到 daemon" --post-data=x "$B/containers/iso-hub-samba/restart"
          probe 404 "POST /containers/iso-hub-qbittorrent/update -> 到 daemon" --post-data=x "$B/containers/iso-hub-qbittorrent/update"
          # 404 而不是 403 = 请求被代理放行、由 daemon 回"没这个容器"; 这正是我们要的:
          # ACL 没拦住, 且测试机上确实没有这三个 sidecar。

          # --- 必须拒绝 (H2 收窄的重点) ---
          probe 403 "GET /containers/json (部署拓扑枚举)"               "$B/containers/json"
          probe 403 "GET /containers/<id>/archive (任意文件读)"         "$B/containers/iso-hub-samba/archive?path=/etc/shadow"
          probe 403 "GET /containers/<未知名字>/json (名字收窄)"        "$B/containers/evil-container/json"
          probe 403 "POST /containers/create (建特权容器)"              --post-data=x "$B/containers/create"
          probe 403 "POST /containers/<name>/exec (进容器)"             --post-data=x "$B/containers/iso-hub-samba/exec"
          probe 403 "GET /images/json (镜像枚举)"                       "$B/images/json"
          probe 403 "GET /v1.44/containers/json (版本前缀绕过)"         "$B/v1.44/containers/json"
          # DELETE 没有单独探: 无条件的最后一条 `http-request deny` 兜住一切未显式 allow 的
          # 方法, 上面 /images/json 的 403 已经证明该兜底真的生效。

      - name: Dump container logs
        if: failure()
        run: docker logs "$CONTAINER" 2>&1 | tail -60 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "$CONTAINER" 2>/dev/null || true
          # socket-proxy 由 compose 起, 用 down 收尾(含它创建的默认网络)
          docker compose down -v --remove-orphans 2>/dev/null || true
          sudo rm -rf "$DATA_DIR"
