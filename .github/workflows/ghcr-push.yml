# ISO Hub - 构建并推送到 GHCR (ghcr.io)
#
# 第三个镜像仓库: ghcr.io/dc1024/iso-hub
# 与 Docker Hub / 阿里云 ACR 推同一套多架构镜像(amd64 + arm64), tag 规则一致:
#   - push 到 beta 分支   -> 只推 :beta (不碰 :latest)
#   - push 到 master 分支 -> 只推 :latest
#   - 打 v* tag (v1.0.8)  -> 推 1.0.8 和 latest 两个 tag
#   - workflow_dispatch   -> 推 latest(可指定版本)
#
# 凭据: 用仓库自带 GITHUB_TOKEN(packages: write), 无需配置任何 secret。
#
# ⚠️ 首次推送后 package 默认为 **private**: 需到仓库/组织
#    Settings → Packages → iso-hub → Package settings 改成 Public,
#    否则匿名 docker pull 需先 docker login ghcr.io。

name: Build & Push GHCR

on:
  push:
    branches: [master, beta]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本 tag（留空则只推 latest）'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image tags
        id: ver
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # v1.0.8 -> 1.0.8 (去 v 前缀); 正式发版同时推进 latest
            VER="${GITHUB_REF_NAME#v}"
            TAGS="${IMAGE}:${VER},${IMAGE}:latest"
          elif [ "${GITHUB_REF_NAME}" = "beta" ]; then
            # 开发分支: 只推 :beta, 绝不动 :latest
            TAGS="${IMAGE}:beta"
          else
            # master 的 push
            TAGS="${IMAGE}:latest"
          fi
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAGS="${TAGS},${IMAGE}:${{ github.event.inputs.version }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.ver.outputs.tags }}
          # 多架构: 与 Docker Hub / ACR 一致(amd64 + arm64, 暂不含 arm/v7)
          platforms: linux/amd64, linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
