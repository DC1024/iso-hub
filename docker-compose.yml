services:
  iso-hub:
    build:
      context: .
      args:
        # 国内镜像加速，可被 .env 中 PIP_INDEX_URL 覆盖
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    image: iso-hub:latest
    container_name: iso-hub
    restart: unless-stopped
    # ---- 非 root + 只读根文件系统(v1.5.0) ----
    # 镜像内已 USER 10001:10001, 这里再显式写一遍是给 `docker compose config` 一份
    # 可见的声明(也防止有人 build 了旧镜像却以为降权已生效)。
    # ⚠️ 升级到 1.5.0 前先在宿主机执行:
    #      chown -R 10001:10001 ./data ./backups ./qb-config ./webdav-config ./samba-config
    #    否则启动自检会立即退出并打印这条命令。
    user: "10001:10001"
    # 根文件系统只读: 运行期唯一可写的是下面显式挂载的卷 + 内存盘 /tmp。
    # 这条是"应用被攻破"时的兜底 —— 攻击者无法往 /app 写 webshell、无法改 site-packages
    # 注入代码, 重启即恢复。前提条件(已在 v1.5.0 逐一确认):
    #   · PYTHONDONTWRITEBYTECODE=1 → 不写 __pycache__
    #   · gpg 全部走 tempfile.TemporaryDirectory()(在 /tmp) + 显式 GNUPGHOME
    #   · 全部业务写盘都落在 /data、/qb-config、/webdav-config、/samba-config
    read_only: true
    tmpfs:
      # gpg 验签中间文件、各 runner 的临时文件都在这; 64m 对单个 checksum 文件足够
      - /tmp:mode=1777,size=64m
      # gpg 的 homedir 也挂成内存盘。代码里每次调用 gpg 都已显式把 GNUPGHOME 指到
      # tempfile 临时目录, 这条是兜底: `gpg --show-keys` 这类"看起来只读"的调用
      # 也会在 homedir 里创建 pubring.kbx, 只读根文件系统下会 Fatal 且不输出指纹。
      - /home/isohub:mode=700,uid=10001,gid=10001,size=8m
    # 安全: 进程不需要任何特权操作(不绑低端口、不改文件属主、不加载内核模块), 因此
    # 丢弃全部 capabilities; 再叠加 no-new-privileges, 杜绝 setuid 提权。
    # 注意: 已是 uid 10001 非 root, cap_drop 是第二层 —— 即使有残留 capability 也拿不到
    # DAC_OVERRIDE/CHOWN/SETUID, 无法越界改写挂载点之外的文件。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # ---- 资源上限(v1.5.3) ----
    # 为什么需要: 主容器同时承担 下载 / SHA256 校验 / GPG 验签 / qB 客户端操作,
    # 全是 CPU 或 IO 密集型; 校验一个 30GB ISO 或 qB 做种异常时会长时间占满资源。
    # 不设上限时, 它能吃到整台 NAS 的内存(实测宿主机 15GB, 常态仅剩 4GB 可用),
    # 而同一台机器上还跑着 PVE 备份与监控。
    # 取值依据(实测): 空载常驻 67MB / 0.01% CPU; 8 核 15GB 宿主。
    #   mem_limit 1g   —— 约 15 倍余量, 同时给 PHP/Node 类邻居留出空间
    #   cpus 2.0       —— SHA256/GPG 是单线程, 2 核足够, 且不会饿死其他服务
    #   pids_limit 256 —— waitress 线程 + iso_runner 子进程, 正常不超过 20
    # 这三个参数用顶层键(而非 deploy.resources), 因为本项目生产用 `docker run` 部署,
    # compose 只是同构参考; 部署脚本必须同步透传 --memory/--cpus/--pids-limit。
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    ports:
      # 左侧可改: 例如 "8099:8080" 或 "127.0.0.1:8080:8080"(仅本机访问)
      - "${ISO_HUB_PORT:-8899}:8080"
    volumes:
      # 所有 ISO 与发行版清单持久化到宿主机 ./data
      - ./data:/data
      # M8: 配置备份**必须在共享树之外**。./data 会整块经 Samba(:/srv/iso)与
      # WebDAV(:/data)只读共享, 而归档里就是 settings.json —— 会话 token、SMTP
      # 授权码、qB/共享口令全在里头。0700/0600 挡的是"同机其他用户", 挡不住以
      # root(Samba 的 USERID=0)或同 uid(WebDAV 的 iso=10001)运行的共享进程。
      # ⚠️ samba / webdav 服务**不得**挂载这个卷。
      - ./backups:/backups
      # qBittorrent 配置目录: 主容器直接改写 qBittorrent.conf 以设置固定 WebUI 密码
      - ./qb-config:/qb-config:rw
      # webdav 凭据配置目录: 与 webdav 容器共享(网页改密码后主容器改写此文件)
      - ./webdav-config:/webdav-config
      # samba 凭据目录: 主容器写入 samba-users.conf, samba 容器启动时只读解析
      # (凭据不再进容器的 Cmd, 因此 docker inspect / ps 里看不到明文)
      - ./samba-config:/samba-config
      # 安全: 主容器不再直连裸 docker.sock, 改经 socket-proxy(TCP) 受限访问 Docker API。
      # 详见 socket-proxy 服务定义。原有 /var/run/docker.sock 挂载已移除。
    environment:
      - TZ=Asia/Shanghai
      # 通过 socket-proxy 访问 Docker Engine API(白名单端点), 不再需要裸 sock
      - DOCKER_HOST=tcp://socket-proxy:2375
      # webdav 配置文件路径(宿主机 ./webdav-config/webdav.yml 挂到容器内 /webdav-config/)
      - WEBDAV_CONF=${WEBDAV_CONF:-/webdav-config/webdav.yml}
      # 配置备份输出目录(M8): 默认 <data-dir> 同级的 backups/, 容器内即 /backups。
      # 改到别处时记得同步改下面的 volumes 与宿主 chown。
      - ISO_HUB_BACKUP_DIR=${ISO_HUB_BACKUP_DIR:-/backups}
      # 需要鉴权时在宿主机同目录建 .env:  ISO_HUB_TOKEN=你的随机密码
      - ISO_HUB_TOKEN=${ISO_HUB_TOKEN:-}
      # M10: 机密可以改走只读文件 —— 走环境变量会长期留在 `docker inspect` 的
      # .Config.Env 与容器内 /proc/<pid>/environ 里。用法(挂在 /run/secrets 下):
      #   volumes: - ./secrets/token:/run/secrets/iso_hub_token:ro
      #   .env:     ISO_HUB_TOKEN_FILE=/run/secrets/iso_hub_token
      # 两者都设时以 ISO_HUB_TOKEN 为准并告警(优先级与 ISO_HUB_SECRET_KEY 一致)。
      - ISO_HUB_TOKEN_FILE=${ISO_HUB_TOKEN_FILE:-}
      # 可选: 对 data/settings.json 整文件做 AES-GCM 静态加密(不设则明文, 向后兼容)。
      # 与登录密码无关; 生产建议用 ISO_HUB_SECRET_KEY_FILE 从 Docker secret/只读文件读密钥。
      # 例: .env 里 ISO_HUB_SECRET_KEY=<随机字符串> 或 ISO_HUB_SECRET_KEY_FILE=/run/secrets/iso_hub_secret
      - ISO_HUB_SECRET_KEY=${ISO_HUB_SECRET_KEY:-}
      - ISO_HUB_SECRET_KEY_FILE=${ISO_HUB_SECRET_KEY_FILE:-}
      # 强制登录门禁: 1=必须登录管理员账号才能使用(默认), 0=关闭登录门禁
      - ISO_HUB_REQUIRE_LOGIN=${ISO_HUB_REQUIRE_LOGIN:-1}
      # 反向代理支持(H1): 前置 nginx/Caddy/Traefik 时设 1, 从 X-Forwarded-For 取真实 IP。
      # ⚠️ 没有反代不要开 —— 该头客户端可伪造, 开了等于允许自称 127.0.0.1。
      - ISO_HUB_TRUST_PROXY=${ISO_HUB_TRUST_PROXY:-}
      # 管理员账号播种: 首次启动时用这两个变量自动创建管理员
      # 不设置的话, 公网访问登录会报"管理员账号未设置"(防抢注), 只能从服务器本机建号
      - ISO_HUB_ADMIN_USER=${ISO_HUB_ADMIN_USER:-}
      - ISO_HUB_ADMIN_PASS=${ISO_HUB_ADMIN_PASS:-}
      # M10: 推荐改用只读文件(值不进 docker inspect 的 Env)。
      # 两者都设时以 ISO_HUB_ADMIN_PASS 为准并告警 —— 想改走文件请把上面那行删掉。
      #   volumes: - ./secrets/admin_pass:/run/secrets/iso_hub_admin_pass:ro
      #   .env:     ISO_HUB_ADMIN_PASS_FILE=/run/secrets/iso_hub_admin_pass
      - ISO_HUB_ADMIN_PASS_FILE=${ISO_HUB_ADMIN_PASS_FILE:-}
      # 订阅自动同步间隔(秒),默认 86400=每天;设 0 关闭自动调度,仅手动/定时调用
      - ISO_HUB_SYNC_INTERVAL=${ISO_HUB_SYNC_INTERVAL:-86400}
      - ISO_HUB_SOURCE_STRATEGY=${ISO_HUB_SOURCE_STRATEGY:-A}
      # ISO 存放模式: classified=按 类型/发行版 分文件夹(默认); flat=全部平铺到单一 iso/ 目录
      - ISO_HUB_STORAGE_MODE=${ISO_HUB_STORAGE_MODE:-classified}
      # 种子下载(qBittorrent sidecar)连接配置
      - QB_URL=${QB_URL:-http://qbittorrent:8080}
      - QB_USER=${QB_USER:-admin}
      - QB_PASS=${QB_PASS:-adminadmin}
      # 网络共享默认凭据(可在网页「设置→共享设置」修改, 改后写入 ./data/settings.json 覆盖此处)
      # 密码必须显式设置: 1.3.21 起不再内置 iso123, 为空时拒绝启用共享
      - SAMBA_USER=${SAMBA_USER:-iso}
      - SAMBA_PASS=${SAMBA_PASS:-}
      - WEBDAV_USER=${WEBDAV_USER:-iso}
      - WEBDAV_PASS=${WEBDAV_PASS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://127.0.0.1:8080/api/health',timeout=4)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      socket-proxy:
        condition: service_healthy

  # ---------- Docker socket 代理: 收窄主容器对 Docker API 的访问权限 ----------
  # 主容器不再持有裸 /var/run/docker.sock(等价宿主机 root), 而是经此代理按白名单调用。
  # 白名单写在 docker/socket-proxy/haproxy.cfg, 只有四类:
  #   GET /_ping|/version、GET /containers/<三个 sidecar>/json、
  #   POST /containers/<三个 sidecar>/(start|stop|restart|update), 其余 403
  # 为什么不用 tecnativa/docker-socket-proxy 的 env 开关: 它的 ACL 是"方法 + 路径前缀"两档,
  # POST=1 会把 /containers 前缀整体放行 —— 连带 open 了 POST /containers/create(足以创建
  # 挂载宿主根目录的特权容器)与 DELETE /containers/<id>; 而 POST=0 会在第一条规则
  # (`deny unless METH_GET || POST`) 里把 start/stop 一起拒掉。两个需求无法同时表达。
  # 注意: 本服务是核心依赖, 不设 profiles(主容器需持续用它查 sidecar 状态)。
  socket-proxy:
    # 锁定 digest 而非 :latest —— 镜像行为变更会直接影响放行范围, 内容寻址可防篡改/防漂移。
    # 升级方式: docker pull haproxy:2.8-alpine && docker inspect --format='{{index .RepoDigests 0}}' haproxy:2.8-alpine
    image: haproxy:2.8-alpine@sha256:094401c230b9bf01a6a4dc96e455795e261483f3bd2f42f19d0e6f259bd43837
    container_name: iso-hub-socket-proxy
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    # ---- 必须显式以 root 运行, 否则代理形同虚设 ----
    # 官方 haproxy 镜像的默认用户是 uid 99(haproxy), 不是 root。而宿主
    # /var/run/docker.sock 通常是 root:docker 0660 —— uid 99 既不是属主、也不在
    # docker 组, 权限位是 `---`, connect() 直接 EACCES。
    #
    # 表现极具欺骗性(CI 逐 flag 对照实测确认, 与下面的加固无关, 不加也是 503):
    #   haproxy 正常启动、ACL 正常放行、日志里没有任何 ACL 错误,
    #   但每个请求都是 `503 SC--`(连不上后端), 面板上三个 sidecar 全 unknown。
    #
    # 为什么选 root 而不是 group_add:
    #   group_add 需要宿主的 docker 组 gid, 而它每台机器都不一样(CI 上是 113,
    #   Debian/Ubuntu 常见 998/999, NAS 上又是别的)。写死一个默认值 = 换个宿主
    #   就静默坏掉; 写成必填变量 = 老用户升级时 compose 直接报错起不来。
    #   root 是唯一"在任何宿主上都成立"的选择, 而它在这里的权限已经被下面四项
    #   (只读根/零能力/禁提权/无端口发布)压到只剩"能打开这个 socket"。
    #
    # 想改成非 root(可选, 需要你在部署机执行):
    #   stat -c '%g' /var/run/docker.sock        # 拿到 docker 组 gid, 例如 999
    #   然后删掉下面这行 user, 换成:  group_add: ["999"]
    #   并实测三个 sidecar 的启停仍然正常。
    user: "0:0"
    # ---- M9(审查 2026-10): 与主容器同级别的纵深防御 ----
    read_only: true          # 根文件系统只读: 被拿下也写不进后门/替换二进制
    tmpfs:
      - /tmp
      # 这里**绝不能**加 /run。容器里 /var/run 是 /run 的软链接, 而 docker.sock
      # 是按 /var/run/docker.sock 挂进来的 —— 一旦给 /run 挂上 tmpfs, 那个空 tmpfs
      # 会把 socket 整个遮住, 症状与上面权限问题一模一样(503 SC--)。
    cap_drop:
      - ALL                  # 只监听 2375(>1024), 不需要任何 capability
    security_opt:
      - no-new-privileges:true
    volumes:
      # ACL 配置: 显式 allowlist, 见文件头注释
      - ./docker/socket-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # 只有该代理容器持有裸 sock, 且以只读方式挂载
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      # 用容器内自带的 wget 探 /_ping(白名单放行), 代理未就绪则 unhealthy
      #
      # 必须是 127.0.0.1, 不能写 localhost: 容器 /etc/hosts 里同时有
      # `127.0.0.1 localhost` 与 `::1 localhost`, musl 按 RFC 3484 的优先级
      # (::1 为 50, IPv4 映射为 10) 会**先**解析到 ::1; 而 haproxy 的
      # `bind *:2375` 只监听 IPv4。于是 healthcheck 永远 "connection refused"。
      # 后果不是"少个绿灯": 主容器是 depends_on: service_healthy, 全新部署时
      # compose 会直接报 dependency failed to start, 面板根本起不来。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/_ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # 仅容器网络内部可达, 不对外暴露端口

  # ---------- 网络共享 sidecar: 把 ./data 里的 ISO 分享给局域网其他设备 ----------
  # SMB 共享 (PVE 挂载用它):  smb://<服务器IP>:1445/iso
  # 默认不部署, 需启用 compose profile "share":  docker compose --profile share up -d
  # 注意: 宿主机原生 Samba 已占 445/139/137/138, 这里映射到高位空闲端口避免冲突
  #
  # v1.5.3: 三个 sidecar 的 :latest 全部补上 digest。原因和 socket-proxy 那条一样 ——
  # `:latest` 会在你不知情的时候换成新镜像(实测 qBittorrent 的 latest 就是当天更新),
  # 而 sidecar 行为变更会直接影响挂载/共享结果。tag 留作可读性, digest 才是生效的那半。
  # 升级方式: docker pull <镜像> && docker inspect --format='{{index .RepoDigests 0}}' <镜像>
  # dperson/samba 上游自 2021-03 起就没再发版, 只有 latest 与架构 tag, 因此只能靠 digest 锁。
  samba:
    image: dperson/samba:latest@sha256:66088b78a19810dd1457a8f39340e95e663c728083efa5fe7dc0d40b2478e869
    container_name: iso-hub-samba
    restart: no
    profiles: ["share"]
    # 凭据不再走 command —— 明文会长期留在容器的 .Config.Cmd 里(`docker inspect`、
    # `docker ps --no-trunc`、容器内 `ps`、`docker compose config` 都能看到),
    # 而改口令只能删容器重建, 又正好需要 socket-proxy 放行 create/delete。
    # 改为启动时读取 ./samba-config/samba-users.conf(由主容器写入, 0600)生成 -u/-s 参数。
    entrypoint: ["/sbin/tini", "--", "/bin/sh", "/etc/iso-hub/samba-entrypoint.sh"]
    ports:
      - "${SAMBA_PORT:-1445}:445"
      - "${SAMBA_NETBIOS:-1137}:137/udp"
      - "${SAMBA_138:-1138}:138/udp"
      - "${SAMBA_139:-1139}:139"
    volumes:
      - ./data:/srv/iso:ro          # 只读共享,ISO 不会被误改
      # ⚠️ 绝不挂 ./backups: 那里是含 settings.json(会话 token/共享口令)的配置归档。
      #    这正是 M8 把备份挪出 ./data 的原因, 加一行挂载就等于把它又交出去了。
      - ./samba-config:/samba-config:ro
      - ./docker/samba-entrypoint.sh:/etc/iso-hub/samba-entrypoint.sh:ro
    environment:
      - TZ=Asia/Shanghai
      # 这里保持 root(0): dperson/samba 的启动流程要 usermod/chpasswd, 降权会起不来。
      # 它只读挂载 ./data(ro)且只解析主容器写的 0600 账号文件, 权限面已经很小。
      - USERID=${SAMBA_UID:-0}
      - GROUPID=${SAMBA_GID:-0}
      - SAMBA_USERS_FILE=/samba-config/samba-users.conf

  # WebDAV (Windows/其他挂载用它):  http://<服务器IP>:8081/dav
  # 默认不部署, 需启用 compose profile "share":  docker compose --profile share up -d
  webdav:
    image: hacdias/webdav:v5.17.1@sha256:c8d8c436816e51e5773525f901d829afe748d3516995a31a80de1f67fb0a02ca
    container_name: iso-hub-webdav
    restart: no
    profiles: ["share"]
    ports:
      - "${WEBDAV_PORT:-8081}:6065"
    volumes:
      - ./data:/data:ro             # 只读共享
      # ⚠️ 绝不挂 ./backups(同 samba 处的说明): 归档里有 settings.json 明文。
      - ./webdav-config:/config     # 凭据配置目录(挂载目录避免单文件 bind 的坑; 配置文件 webdav.yml 在此目录内)
    environment:
      - TZ=Asia/Shanghai
    command: ["-c", "/config/webdav.yml"]

  # ---------- 种子下载 sidecar: qBittorrent (BitTorrent 下载) ----------
  # iso-hub 把种子/磁力交给它下载, 下载完成文件落入 ./data 被主容器统一识别/校验/删除。
  # 主容器通过内部网络访问: http://qbittorrent:8080 (QB_URL)
  # WebUI: http://<服务器IP>:8090
  # 默认不部署, 需启用 compose profile "bt":  docker compose --profile bt up -d
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:e887804fa9de4c60f5f0fb1f3a7e4febe40a8f69fe736f70c4e8589b1f868dab
    container_name: iso-hub-qbittorrent
    restart: no
    profiles: ["bt"]
    ports:
      - "${QB_PORT:-8090}:8080"
    volumes:
      - ./data:/data             # 与主容器共享同一数据卷, 下载的 ISO 主容器可见
      - ./qb-config:/config      # qBittorrent 配置/日志
      - ./qb-downloads:/downloads # 默认下载目录(iso-hub 会按发行版设 savepath 到 /data/...)
    environment:
      # 必须与主容器同 uid/gid: qBittorrent 往 /data 写 ISO, 若它以 root 写, 主容器
      # (uid 10001 且无 DAC_OVERRIDE)既校验不了也删不掉那些文件。
      - PUID=${QB_PUID:-10001}
      - PGID=${QB_PGID:-10001}
      - TZ=Asia/Shanghai
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
