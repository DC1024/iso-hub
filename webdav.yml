# WebDAV 配置 (hacdias/webdav)
# 此文件所在目录 ./webdav-config 同时挂给 iso-hub(:/webdav-config) 与 webdav(:/config),
# 主容器在网页改密码后重写此文件并 restart webdav 容器即生效。
# 注: 早期版本用单文件 bind (./data/webdav.yml:/config.yml), 在部分内核/Docker 组合上
#     runc 会报 "not a directory", 故改为目录挂载。
# ⚠️ 安全提示: 凭据明文存放。1.3.21 起不再内置 iso123 —— 下面的 password 必须自己改掉;
#     若在面板里设置过 WebDAV 凭据, 该文件会被自动重写, 无需手工维护。
# L2(审查 2026-10): 示例口令原本是一个"看起来像真口令"的占位串, 最容易被原样复制
#     部署。现在改成显式占位值, 且主容器启动时会检测到它并在日志里告警
#     (见 app.py 的 _warn_if_webdav_conf_weak)。**推荐做法: 不要在下面填口令, 直接到
#     面板「共享」里设置 WebDAV 凭据, 由主容器重写本文件。**
address: 0.0.0.0          # 容器内监听地址; 对宿主的暴露范围由 compose 的端口映射决定
port: 6065
prefix: /dav
directory: /data
permissions: R            # 只读 (R); 想可写改成 CRUD
users:
  - username: iso
    password: "CHANGE-ME-BEFORE-USE"   # ← 占位值, 必须修改(或改用面板设置)
    permissions: R        # 只读, 覆盖全局默认(可写则删这行)
log:
  format: console
  outputs:
    - stderr