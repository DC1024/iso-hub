# iso-hub 专用 Docker API 代理 —— 显式白名单
#
# 放行的只有下面四类:
#   1) GET  /_ping, /version                      健康检查与排障
#   2) GET  /containers/...                       查询 sidecar 状态 / 重启策略
#   3) POST /containers/<name>/(start|stop|restart|update)
#   4) 其余一律 403
#
# 明确不放行: create / delete / exec / kill / attach / images / volumes / networks /
# system / secrets / build / swarm。其中 create 最关键 —— 构造一个挂载宿主根目录的
# 特权容器只需要 `POST /containers/create`, 一旦放行, "应用被攻破"就等于"宿主机 root"。
#
# 为什么不用上游 tecnativa/docker-socket-proxy 的环境变量: 它的 ACL 是"HTTP 方法 +
# URL 前缀"两档组合, 首页写着 `http-request deny unless METH_GET || POST`, 所以
#   * POST=1 + CONTAINERS=1 -> /containers 前缀整体放行, 连带 open 了 create/delete;
#   * POST=0                -> 第一条规则就把 start/stop/restart 一起拒掉,
#                              ALLOW_START/ALLOW_STOP 根本走不到。
# 想同时保留"查状态"和"启停"就无法用它表达, 因此改成这份静态白名单。

global
    log stdout format raw daemon
    maxconn 4000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    retries 3
    timeout http-request 10s
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000

backend dockerbackend
    server dockersocket /var/run/docker.sock

frontend dockerfrontend
    bind *:2375

    # 1) 健康检查与版本(只读)
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/(_ping|version)$ }

    # 2) 容器只读查询: GET /containers、/containers/json、/containers/<id>/json 及其子路径
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers(/|$) }

    # 3) 容器写操作白名单: 仅 start/stop/restart/update。
    #    容器名限 [A-Za-z0-9_.-](Docker 允许的字符集), 防止用路径穿越绕过。
    #    注意这里**没有** create/delete/exec/kill。
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/(start|stop|restart|update)$ }

    # 4) 其余全部拒绝(403)
    http-request deny

    default_backend dockerbackend
