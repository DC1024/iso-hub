# iso-hub 专用 Docker API 代理 —— 显式白名单
#
# 放行的只有下面四类:
#   1) GET  /_ping, /version                      健康检查与排障
#   2) GET  /containers/<sidecar>/json            查询 sidecar 状态 / 重启策略
#   3) POST /containers/<sidecar>/(start|stop|restart|update)
#   4) 其余一律 403
#
# 其中 <sidecar> 只有三个名字: iso-hub-samba / iso-hub-webdav / iso-hub-qbittorrent。
# 它们在内核里是硬编码常量(app.py 的 SHARE_CONTAINERS 与 QB_CONTAINER),
# 不存在由用户输入决定容器名的路径, 所以写死这三个不会误伤任何现有功能。
#
# 明确不放行: create / delete / exec / kill / attach / archive / export / logs /
# images / volumes / networks / system / secrets / build / swarm。
# 其中 create 最关键 —— 构造一个挂载宿主根目录的特权容器只需要
# `POST /containers/create`, 一旦放行, "应用被攻破"就等于"宿主机 root"。
#
# 为什么不用上游 tecnativa/docker-socket-proxy 的环境变量: 它的 ACL 是"HTTP 方法 +
# URL 前缀"两档组合, 首页写着 `http-request deny unless METH_GET || POST`, 所以
#   * POST=1 + CONTAINERS=1 -> /containers 前缀整体放行, 连带 open 了 create/delete;
#   * POST=0                -> 第一条规则就把 start/stop/restart 一起拒掉,
#                              ALLOW_START/ALLOW_STOP 根本走不到。
# 想同时保留"查状态"和"启停"就无法用它表达, 因此改成这份静态白名单。

global
    log stdout format raw daemon
    maxconn 4000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    retries 3
    timeout http-request 10s
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000

backend dockerbackend
    server dockersocket /var/run/docker.sock

frontend dockerfrontend
    bind *:2375

    # 1) 健康检查与版本(只读)
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/(_ping|version)$ }

    # 2) 容器只读查询: 只放行三个 sidecar 的 inspect。
    #
    #    H2 修复(审查 2026-10): 旧规则是 `^…/containers(/|$)`, 把 /containers 下
    #    **所有** GET 都放行了。其中两个特别危险:
    #      * GET /containers/<id>/archive?path=/etc/shadow
    #        —— 直接读容器文件系统任意文件(等于路径穿越 + 任意文件读);
    #      * GET /containers/json?all=1
    #        —— 枚举宿主机上所有容器, 泄露完整部署拓扑。
    #    应用实际只用 `GET /containers/<name>/json`(全项目 3 处), 因此收窄到点分
    #    命名空间里的具体端点即可, 功能零影响。
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/(iso-hub-samba|iso-hub-webdav|iso-hub-qbittorrent)/json$ }

    # 3) 容器写操作白名单: 仅这三个 sidecar 的 start/stop/restart/update。
    #    注意这里**没有** create/delete/exec/kill。
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/(iso-hub-samba|iso-hub-webdav|iso-hub-qbittorrent)/(start|stop|restart|update)$ }

    # 4) 兜底拒绝: 即便将来上面的正则被放宽, 这几类端点也先挡死。
    #    haproxy 按顺序求值, allow 命中即短路, 所以这里不会误伤第 1~3 条。
    http-request deny if { path,url_dec -m reg -i /archive }
    http-request deny if { path,url_dec -m reg -i /export }
    http-request deny if { path,url_dec -m reg -i /logs }
    http-request deny if { path,url_dec -m reg -i /exec }
    http-request deny if { path,url_dec -m reg -i /attach }

    # 5) 其余全部拒绝(403)
    http-request deny

    default_backend dockerbackend
